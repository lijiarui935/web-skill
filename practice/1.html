 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG图标</title>
    <script src="./fon/iconfont.js"></script>
    <link rel="stylesheet" href="./css/1.css">
</head>

<body>
    <h3>SVG图标</h3>
    <div class="tab-nav">
        
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-anquanshouhu"></use>
            </svg>
            <span>安全守护</span>
            <!-- 数字红点 -->
               <div class="budge-num" id="budge-plan">4</div>
            <class="tab-"></class> <!-- div.budge-dot回车 -->
        </div>

        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-dianzan"></use>
            </svg>
            <span>点赞</span>
            <div class="budge-num" id="budge-plan"> 6</div>  
        </div>

        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-tianjiahaoyou"></use>
            </svg>
            <span>添加好友</span>
            <div class="budge-num" id="budge-plan"> </div> 
        </div>

        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-tongzhi"></use>
            </svg>
            <span>通知</span>
        </div>

    </div>
    <script>
        // 写一个函数当我点击当前的item的时候，颜色发生变化
        function changeTab(current) {
            let tabs = document.querySelectorAll('.tab-item');
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
            }
            current.classList.add('active');
        }
    </script>
</body>
</html>
